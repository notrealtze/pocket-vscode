name: Build APK

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Bundle Node as native lib
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          wget https://nodejs.org/dist/v20.19.0/node-v20.19.0-linux-arm64.tar.gz
          tar -xzf node-v20.19.0-linux-arm64.tar.gz
          cp node-v20.19.0-linux-arm64/bin/node app/src/main/jniLibs/arm64-v8a/libnode.so

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketVSCode
          path: app/build/outputs/apk/debug/app-debug.apk
